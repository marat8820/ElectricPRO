
name: Build ElectricPRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/electricpro/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ElectricPRO"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.electricpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.electricpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Электрик PRO"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF

          cat > app/src/main/java/com/electricpro/app/MainActivity.java <<'EOF'
          package com.electricpro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              int navy = Color.rgb(11, 23, 36);
              int panel = Color.rgb(24, 42, 59);
              int yellow = Color.rgb(255, 211, 78);
              int white = Color.WHITE;
              LinearLayout content;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(navy);
                  getWindow().setNavigationBarColor(navy);
                  showHome();
              }

              TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(white);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(12, 12, 12, 12);
                  return t;
              }

              void base(String title) {
                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(20, 20, 20, 24);
                  content.setBackgroundColor(navy);
                  scroll.setBackgroundColor(navy);
                  scroll.addView(content);
                  setContentView(scroll);

                  TextView heading = text("⚡ ЭЛЕКТРИК PRO", 26);
                  heading.setTextColor(yellow);
                  heading.setTypeface(null, Typeface.BOLD);
                  content.addView(heading);
                  content.addView(text(title, 18));
              }

              void button(String title, Runnable action) {
                  Button b = new Button(this);
                  b.setText(title);
                  b.setTextColor(navy);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(yellow));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      -1, -2);
                  p.setMargins(0, 8, 0, 8);
                  content.addView(b, p);
                  b.setOnClickListener(v -> action.run());
              }

              void showHome() {
                  base("Инструменты профессионального электрика");
                  button("🧮 Электрические калькуляторы", this::showCalculators);
                  button("📚 Справочник электрика", this::showReference);
                  button("📋 Смета и материалы", this::showEstimate);
                  button("🏗 Мои объекты", this::showProjects);
                  content.addView(text(
                      "Работайте безопасно. Расчёты необходимо проверять "
                      + "по действующим нормам и условиям объекта.", 13));
              }

              void showCalculators() {
                  base("Электрические калькуляторы");
                  button("Мощность: P = U × I", () ->
                      inputCalculator("Мощность (Вт)", "Введите напряжение U (В)",
                          "Введите ток I (А)", 0));
                  button("Ток: I = P / U", () ->
                      inputCalculator("Ток (А)", "Введите мощность P (Вт)",
                          "Введите напряжение U (В)", 1));
                  button("Сопротивление: R = U / I", () ->
                      inputCalculator("Сопротивление (Ом)", "Введите напряжение U (В)",
                          "Введите ток I (А)", 2));
                  button("← На главную", this::showHome);
              }

              void inputCalculator(String title, String first, String second,
                                   int mode) {
                  android.widget.EditText a = new android.widget.EditText(this);
                  android.widget.EditText b = new android.widget.EditText(this);
                  a.setHint(first);
                  b.setHint(second);
                  a.setInputType(8194);
                  b.setInputType(8194);
                  a.setTextColor(white);
                  b.setTextColor(white);
                  a.setHintTextColor(0xFFB0BEC5);
                  b.setHintTextColor(0xFFB0BEC5);
                  content.addView(a);
                  content.addView(b);
                  TextView result = text("Введите значения и нажмите «Рассчитать»", 16);
                  content.addView(result);
                  button("Рассчитать", () -> {
                      try {
                          double x = Double.parseDouble(a.getText().toString());
                          double y = Double.parseDouble(b.getText().toString());
                          if (x <= 0 || y <= 0) throw new Exception();
                          double r = mode == 0 ? x * y :
                                     mode == 1 ? x / y : x / y;
                          result.setText(title + ": " + String.format(
                              java.util.Locale.getDefault(), "%.2f", r));
                      } catch (Exception e) {
                          result.setText("Введите два положительных числа.");
                      }
                  });
                  button("← К калькуляторам", this::showCalculators);
              }

              void showReference() {
                  base("Справочник электрика");
                  content.addView(text(
                      "Основные формулы\n\n"
                      + "Мощность постоянного тока: P = U × I\n"
                      + "Ток: I = P / U\n"
                      + "Сопротивление: R = U / I\n\n"
                      + "Цвета проводников могут зависеть от системы "
                      + "и действующих норм. Не определяйте назначение "
                      + "проводника только по цвету — проверяйте измерениями "
                      + "и документацией.\n\n"
                      + "Перед работой отключите питание и проверьте "
                      + "отсутствие напряжения подходящим прибором.", 16));
                  button("← На главную", this::showHome);
              }

              void showEstimate() {
                  base("Смета и материалы");
                  content.addView(text(
                      "Здесь будет список материалов и расчёт стоимости работ.",
                      16));
                  button("← На главную", this::showHome);
              }

              void showProjects() {
                  base("Мои объекты");
                  content.addView(text(
                      "Здесь появится учёт клиентов, объектов и выполненных работ.",
                      16));
                  button("← На главную", this::showHome);
              }
          }
          EOF

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricPRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
